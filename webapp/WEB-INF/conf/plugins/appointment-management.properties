# {plugin.pluginName} properties file

#######################################################################################################
# Default Labels for XPage
appointment-management.pageTitle=appointment-management
appointment-management.pagePathLabel=appointment-management

# Lucene
#
# indexPath must not be the webapp root : plugin-forms ships the same /index default on
# this line, so on a site installing both, whichever opens its IndexWriter first holds
# the Lucene lock and the other fails on every run with LockObtainFailedException
# "Lock held by this virtual machine", leaving its index never written. The value below
# follows the convention of the other indexers - document uses /plugins/document/index,
# blog /plugins/blogs/index.
appointment-management.globalIndexer.enable=true
appointment-management.internalIndexer.lucene.indexPath=/plugins/appointment-management/index
appointment-management.internalIndexer.lucene.indexInWebapp=true
appointment-management.index.writer.commit.size=500
appointment-management.itemsPerPage=10
